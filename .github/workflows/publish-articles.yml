name: Publish Articles via n8n

on:
  # SENGAJA tanpa filter `paths: articles/**`. Filter itu mematikan satu-satunya cara
  # mengirim ulang artikel lama: `git commit --allow-empty -m "[repost: nama-folder]"`.
  # Commit kosong tidak menyentuh berkas apa pun, jadi tidak ada path yang cocok dan
  # Action-nya dilewati diam-diam — mekanisme pemulihannya kelihatan jalan padahal tidak
  # pernah dieksekusi.
  #
  # Yang menggantikan filternya ada di publish.js: kalau tidak ada folder artikel yang
  # berubah DAN tidak ada penanda [repost:], dia berhenti sebelum memanggil webhook.
  # Jadi push yang cuma menyentuh docs/ atau n8n/ berakhir dalam hitungan detik.
  push:
  # Full re-sync manual: kirim semua artikel dan prune yang sudah dihapus.
  # Mode ini tidak pernah memicu posting ke sosmed.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Tanpa guard ini push ke branch mana pun ikut publish. Sejak n8n menyambung
    # ke LinkedIn dan Instagram, itu berarti branch percobaan bisa ikut mem-posting.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Butuh commit sebelumnya supaya `git diff` bisa cari artikel yang berubah.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios marked

      # Parser rusak ketahuan di sini, bukan setelah payload salah dikirim ke n8n.
      - name: Self-check
        run: node --test .github/scripts/publish.test.mjs

      - name: Publish updated articles
        run: node .github/scripts/publish.js
        env:
          # Nama secret harus persis seperti yang dibuat di repo. Sebelumnya di sini
          # tertulis N8N_WEBHOOK_URL sementara secretnya bernama WEBHOOK_URL, jadi
          # nilainya kosong dan Action gagal dengan pesan yang menyalahkan secret lain.
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # Opsional: webhook n8n saat ini tanpa autentikasi. Diisi hanya kalau
          # Header Auth dinyalakan lagi di node Webhook.
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          # Kosong saat workflow_dispatch → publish.js jatuh ke mode sync.
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
